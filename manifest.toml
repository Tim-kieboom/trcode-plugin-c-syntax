id = "c-syntax"
name = "C"
version = "0.0.1"
abi = "1.12"
# A language and nothing else: no module of its own and no pane. The grammar is the file the
# installer downloads and checks.

[language]
name = "C"
grammar = "c.wasm"
extensions = ["c", "h"]
comment = "//"
# Based on queries/highlights.scm of https://github.com/tree-sitter/tree-sitter-c (v0.24.1, 7fa1be1).
# The patterns are in the opposite order of the grammar's file (TerminalCode takes the first of two
# patterns on the same text, and that file is written for the last), with more of C covered: control
# keywords, more operators, brackets, parameters, enumerators, macros and escapes. Capture names are
# ones themes have a color for.
highlights = '''
(comment) @comment

(escape_sequence) @string.escape
(string_literal) @string
(system_lib_string) @string
(char_literal) @string
(number_literal) @number

(true) @boolean
(false) @boolean
(null) @constant.builtin

; Names that say what they are, before the plain identifier
(call_expression
  function: (identifier) @function)
(call_expression
  function: (field_expression
    field: (field_identifier) @function.method))
(function_declarator
  declarator: (identifier) @function)
(preproc_function_def
  name: (identifier) @function)
(preproc_def
  name: (identifier) @constant)
(enumerator
  name: (identifier) @constant)
(parameter_declaration
  declarator: (identifier) @variable.parameter)
(parameter_declaration
  declarator: (pointer_declarator
    declarator: (identifier) @variable.parameter))
(statement_identifier) @label
(field_identifier) @property
(type_identifier) @type
(primitive_type) @type
(sized_type_specifier) @type

((identifier) @constant
  (#match? @constant "^[A-Z][A-Z\\d_]*$"))

(identifier) @variable

[
  "if" "else" "switch" "case" "default"
  "for" "while" "do" "break" "continue" "return" "goto"
] @keyword.control

[
  "const" "enum" "extern" "inline" "register" "restrict" "sizeof"
  "static" "struct" "typedef" "union" "volatile"
] @keyword

[
  "#define" "#elif" "#else" "#endif" "#if" "#ifdef" "#ifndef" "#include"
] @keyword
(preproc_directive) @keyword

[
  "--" "-" "-=" "->" "=" "!=" "*" "&" "&&" "+" "++" "+=" "<" "==" ">" "||"
  "/" "%" "<<" ">>" "|" "^" "~" "!" "<=" ">=" "*=" "/=" "%=" "&=" "|=" "^=" "<<=" ">>=" "?"
] @operator

[ "(" ")" "[" "]" "{" "}" ] @punctuation.bracket
[ "." ";" "," ":" ] @punctuation.delimiter
'''
